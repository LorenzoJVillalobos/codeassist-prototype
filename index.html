<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="CodeAssist is a concept prototype for locating, verifying, and saving building-code references.">
  <title>CodeAssist | Building-code reference organizer</title>
  <style>
    :root { --ink:#162231;--navy:#19354b;--navy-dark:#112638;--accent:#3c6d73;--muted:#667481;--line:#dbe2e6;--surface:#fff;--background:#f4f6f7;--soft:#eef3f4;--radius:12px; }
    * {box-sizing:border-box} body{margin:0;background:var(--background);color:var(--ink);font-family:Arial,Helvetica,sans-serif;letter-spacing:.01em} button,input,select,textarea{font:inherit} button{cursor:pointer} button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7dabb0;outline-offset:3px}
    header{background:var(--navy-dark);color:white;box-shadow:0 2px 5px #16233112} .topbar{max-width:1240px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:24px;height:80px;padding:0 28px}.logo{display:flex;align-items:center;gap:14px;cursor:pointer}.logo-symbol{width:41px;height:41px;border:1.5px solid #b6d2d5;border-radius:10px;display:grid;place-items:center;color:#cbe2e5;font-weight:bold;font-size:22px}.brand{font-size:22px;letter-spacing:-.03em;font-weight:750}.brand-caption{font-size:10px;color:#adc3cd;letter-spacing:.16em;text-transform:uppercase;margin-top:2px}.nav{display:flex;align-items:center;gap:9px}.nav button{border:1px solid transparent;background:transparent;color:#d1dde3;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600}.nav button[aria-current="page"]{background:#2b495d;color:white;border-color:#52697b}.nav button:hover{background:#29475b}
    main{max-width:1240px;margin:0 auto;padding:46px 28px 72px;min-height:calc(100vh - 147px)}.eyebrow{color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.17em;font-weight:750;margin-bottom:16px}.page-head{max-width:760px}.page-head h1{font-size:38px;letter-spacing:-.045em;line-height:1.16;margin:0 0 16px;color:#152b3e;font-weight:750}.page-head p{line-height:1.65;font-size:16px;color:var(--muted);margin:0}.layout{display:grid;grid-template-columns:290px 1fr;align-items:start;gap:25px;margin-top:29px}.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 3px 12px #1b2c3910}.filters{padding:26px 24px}.panel-label{font-size:11px;letter-spacing:.14em;color:#415665;text-transform:uppercase;font-weight:700;margin-bottom:20px}.field{display:block;margin-bottom:23px}.field label{font-weight:700;font-size:13px;display:block;margin-bottom:9px;color:#314251}.field input,.field select,.field textarea{background:#fff;color:#2a3d4a;border:1px solid #cbd6da;border-radius:7px;padding:13px 12px;width:100%;font-size:14px}.field input::placeholder{color:#8997a1}.hint{font-size:12px;line-height:1.55;color:#798791;margin-top:9px}.search-box{background:white;border:1px solid var(--line);border-radius:12px;padding:27px;display:flex;gap:13px;align-items:flex-end;box-shadow:0 3px 12px #1b2c3910}.search-box .field{flex:1;margin:0}.search-box input{height:51px;font-size:16px;padding-left:16px}.btn{background:var(--navy);color:white;border:1px solid var(--navy);border-radius:7px;min-height:48px;padding:0 23px;font-size:13px;letter-spacing:.015em;font-weight:700;transition:background .15s}.btn:hover{background:#33576b}.btn.secondary{background:white;color:var(--navy);border-color:#b5c2c9}.btn.secondary:hover{background:#edf1f3}.btn.tertiary{background:transparent;color:var(--navy);border-color:transparent}.search-box .btn{height:51px;white-space:nowrap}.info-band{display:flex;gap:14px;align-items:flex-start;background:#e9f0f0;border:1px solid #d2e0e0;border-radius:9px;padding:17px 20px;margin:24px 0;color:#415d66;line-height:1.5;font-size:13px}.info-band b{color:#294852}.small-icon{width:23px;height:23px;flex-shrink:0;border-radius:50%;background:#d2e3e3;display:grid;place-items:center;color:#335b60;font-weight:bold}.how{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:29px}.step{padding:24px 22px;min-height:190px}.step-number{font-weight:800;letter-spacing:.1em;color:#64818a;font-size:12px}.step h3{font-size:18px;color:#203849;margin:17px 0 9px}.step p{font-size:13px;color:#637682;line-height:1.6;margin:0}.sample{margin-top:26px;padding:22px 27px;display:flex;align-items:center;justify-content:space-between;gap:24px}.sample b{font-size:15px}.sample p{color:#677885;font-size:13px;margin:8px 0 0;line-height:1.55}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin:0 0 22px}.section-head h2{font-size:22px;margin:0 0 7px}.section-head p{margin:0;color:#6d7b85;font-size:13px}.results{display:flex;flex-direction:column;gap:16px}.result-card{padding:25px 28px}.badge-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}.pill{border-radius:5px;background:#eef2f4;color:#496171;font-size:11px;font-weight:750;letter-spacing:.04em;padding:6px 9px}.pill.source{background:#e1ebee;color:#2e6267}.result-card h3{font-size:21px;letter-spacing:-.015em;margin:0 0 11px;color:#1d3547}.result-card p{font-size:14px;line-height:1.65;color:#60727d;max-width:680px;margin:0 0 18px}.meta{border-top:1px solid #edf0f2;display:flex;align-items:center;justify-content:space-between;padding-top:18px;gap:12px;flex-wrap:wrap}.meta small{font-size:12px;color:#6b7d88}.link-button{color:#20586a;border:0;background:transparent;font-weight:700;font-size:13px;padding:8px 0}.link-button:hover{text-decoration:underline}.breadcrumbs{font-size:13px;color:#71808a;margin-bottom:24px}.breadcrumbs button{background:none;border:none;color:#345d68;padding:0;font-weight:600}.detail-layout{display:grid;grid-template-columns:1fr 340px;gap:26px;margin-top:24px}.detail-main{padding:33px 35px}.detail-main h2{font-size:30px;letter-spacing:-.035em;margin:18px 0 16px}.detail-main h3,.detail-side h3{font-size:15px;margin:0 0 13px;color:#294151}.detail-main p{line-height:1.75;font-size:14px;color:#657581}.fact-list{display:grid;grid-template-columns:145px 1fr;gap:15px;font-size:13px;padding:20px 0;border-top:1px solid #e6e9eb;margin-top:25px}.fact-list strong{font-weight:700;color:#4b6070}.fact-list span{color:#314958}.detail-side{padding:27px}.detail-side p{color:#657682;font-size:13px;line-height:1.68}.status{background:#fff9e8;color:#68582c;border:1px solid #ece2bf;padding:13px 14px;font-size:12px;line-height:1.5;border-radius:7px;margin:18px 0}.field textarea{min-height:120px;resize:vertical;line-height:1.5}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions .btn{flex:1}.saved-card{display:flex;justify-content:space-between;align-items:start;padding:27px 31px;gap:26px;margin-bottom:16px}.saved-card h3{margin:0 0 8px;color:#1f3b4e;font-size:21px}.saved-card p{color:#647684;font-size:13px;line-height:1.65;max-width:620px;margin:0 0 15px}.saved-meta{font-size:12px;color:#53737c;font-weight:700;margin-bottom:12px}.note{background:#f4f7f7;border-left:3px solid #92b4b8;padding:12px 15px;font-size:13px;line-height:1.6;color:#415664}.empty{padding:56px 40px;text-align:center}.empty h3{margin:0 0 12px}.empty p{color:#687985;line-height:1.6}.footer{font-size:12px;color:#8e9faa;text-align:center;border-top:1px solid #dde6ea;max-width:1184px;margin:0 auto;padding:22px 20px 30px}.footer strong{color:#4b6977}.stat{font-size:12px;background:#eef3f5;border-radius:5px;padding:8px 11px;color:#527080}.demo-flag{margin-left:7px;color:#71838b;font-size:11px}.subheading{font-size:12px;letter-spacing:.1em;color:#567782;text-transform:uppercase;font-weight:800;margin:28px 0 12px}
    @media(max-width:850px){.layout,.detail-layout{grid-template-columns:1fr}.how{grid-template-columns:1fr}.topbar{height:auto;min-height:77px;padding:16px 18px}.brand{font-size:19px}main{padding:32px 16px}.page-head h1{font-size:30px}.search-box{display:block}.search-box .btn{margin-top:14px;width:100%}.saved-card{display:block}.saved-card .btn{margin-top:18px}.sample{display:block}.sample .btn{margin-top:16px}.nav button{padding:9px}.detail-main{padding:23px}.detail-side{padding:23px}}
  </style>
</head>
<body>
<header><div class="topbar"><div class="logo" role="button" tabindex="0" aria-label="Go to CodeAssist home" data-go="home"><div class="logo-symbol">C</div><div><div class="brand">CodeAssist</div><div class="brand-caption">Reference organizer</div></div></div><nav class="nav" aria-label="Main navigation"><button data-go="home">Find references</button><button data-go="saved">Saved references <span id="save-count"></span></button></nav></div></header>
<main id="app" aria-live="polite"></main>
<footer class="footer">CMPA 4302 · Project 01 concept prototype &nbsp; | &nbsp; <strong>Demonstration references only.</strong> Verify code text, edition, adoption, and amendments with authoritative sources.</footer>
<script>
'use strict';
const REFS=[
  {id:'irc-guards',code:'IRC',edition:'2021',section:'R312.1',title:'Guards',publisher:'International Code Council',topic:'deck guard railing guards residential deck',about:'An example reference for researching guard requirements at residential decks and elevated walking surfaces. This organizer does not reproduce the code text.',url:'https://codes.iccsafe.org/',scope:'Residential construction'},
  {id:'irc-handrails',code:'IRC',edition:'2021',section:'R311.7.8',title:'Handrails',publisher:'International Code Council',topic:'stairs handrail grip railing residential',about:'An example reference used to locate handrail provisions and confirm the applicable published requirements.',url:'https://codes.iccsafe.org/',scope:'Residential construction'},
  {id:'ibc-egress',code:'IBC',edition:'2021',section:'Chapter 10',title:'Means of Egress',publisher:'International Code Council',topic:'egress exit accessible exit route stairs',about:'An example chapter reference for locating provisions related to building egress.',url:'https://codes.iccsafe.org/',scope:'Commercial and other IBC occupancies'},
  {id:'ibc-access',code:'IBC',edition:'2021',section:'Chapter 11',title:'Accessibility',publisher:'International Code Council',topic:'accessibility accessible routes parking aisles',about:'An example chapter reference for locating accessibility-related code requirements.',url:'https://codes.iccsafe.org/',scope:'Applicable IBC occupancies'},
  {id:'upc-water',code:'UPC',edition:'2021',section:'Chapter 6',title:'Water Supply and Distribution',publisher:'IAPMO',topic:'water distribution piping pressure plumbing fixture',about:'An example chapter reference for plumbing water-supply questions.',url:'https://iapmo.org/read-iapmo-codes-online',scope:'Plumbing systems'},
  {id:'umc-vent',code:'UMC',edition:'2021',section:'Chapter 4',title:'Ventilation Air',publisher:'IAPMO',topic:'ventilation mechanical air exhaust fan',about:'An example chapter reference for ventilation questions.',url:'https://iapmo.org/read-iapmo-codes-online',scope:'Mechanical systems'}
];
const escapeHTML=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storageKey='codeassist_project01_saved_v1';
let saved=[];try {let stored=localStorage.getItem(storageKey);saved=stored===null?[{id:'irc-guards',note:'Check the adopted edition and local requirements before using this reference in a correction comment.',demo:true}]:JSON.parse(stored);}catch(e){saved=[];}
let state={screen:(new URLSearchParams(location.search).get('screen')||'home'),query:'deck guard',code:'IRC',edition:'2021',jurisdiction:'New Mexico',id:'irc-guards'};
const saveState=()=>{try{localStorage.setItem(storageKey,JSON.stringify(saved))}catch(e){}};
function navigate(screen,id){state.screen=screen;if(id)state.id=id;const url=new URL(location.href);url.searchParams.set('screen',screen);history.pushState({screen,id},'',url);render();window.scrollTo({top:0,behavior:'instant'});}
function label(ref){return `${ref.edition} ${ref.code} · ${ref.section}`}
const badge=(x,cl='')=>`<span class="pill ${cl}">${escapeHTML(x)}</span>`;
function resultList(){let q=state.query.toLowerCase().trim();let vals=REFS.filter(r=>(state.code==='All publications'||r.code===state.code)&&(state.edition==='All editions'||r.edition===state.edition)&&(!q||q.split(/\s+/).some(w=>(r.topic+' '+r.title+' '+r.section+' '+r.code).toLowerCase().includes(w))));return vals;}
function filterPanel(){return `<aside class="panel filters"><div class="panel-label">Narrow your search</div><div class="field"><label for="code">Publication</label><select id="code"><option>All publications</option>${['IRC','IBC','UPC','UMC'].map(s=>`<option ${state.code===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="edition">Code edition</label><select id="edition"><option ${state.edition==='2021'?'selected':''}>2021</option><option ${state.edition==='All editions'?'selected':''}>All editions</option></select><div class="hint">The demonstration dataset uses 2021 editions only.</div></div><div class="field"><label for="jurisdiction">Jurisdiction</label><select id="jurisdiction"><option ${state.jurisdiction==='New Mexico'?'selected':''}>New Mexico</option><option ${state.jurisdiction==='Not selected'?'selected':''}>Not selected</option></select><div class="hint">Selection stores context only. Local adoptions and amendments have not been verified.</div></div><button id="apply" class="btn" style="width:100%">Apply filters</button></aside>`;}
function searchForm(){return `<form class="search-box" id="searchform"><div class="field"><label for="search">Search a code topic or section</label><input id="search" name="search" autocomplete="off" value="${escapeHTML(state.query)}" placeholder="Try deck guard, handrail, ventilation..."></div><button class="btn" type="submit">Find references &nbsp; →</button></form>`;}
function home(){return `<div class="eyebrow">A clearer starting point for code research</div><div class="page-head"><h1>Find the reference.<br>Verify the source.<br>Keep it organized.</h1><p>Search a building-code topic, narrow the publication and edition, and save useful references alongside your own notes. CodeAssist points you back to the publisher for the actual code language.</p></div><div class="layout">${filterPanel()}<section>${searchForm()}<div class="info-band"><div class="small-icon">i</div><div><b>Before relying on a section</b><br>Confirm the governing edition, jurisdiction, official text, and any applicable local amendments. CodeAssist is a reference organizer, not an automated compliance determination.</div></div><div class="how"><article class="panel step"><div class="step-number">01 / FIND</div><h3>Search by topic</h3><p>Start with plain words, then narrow by code family and edition.</p></article><article class="panel step"><div class="step-number">02 / VERIFY</div><h3>Check the source</h3><p>See the publisher and section identifier before opening the official library.</p></article><article class="panel step"><div class="step-number">03 / SAVE</div><h3>Keep the context</h3><p>Save the publication, edition, section, jurisdiction, and a personal note.</p></article></div><div class="panel sample"><div><b>Try a common plan-review question</b><p>Example topic: residential deck guards. The prototype includes representative references to explore.</p></div><button class="btn secondary" data-go="results">Explore example →</button></div></section></div>`;}
function results(){let rows=resultList();return `<div class="eyebrow">Step 02 / Find a reference</div><div class="page-head"><h1>Reference results</h1><p>Review the publication, edition, and section identifier before following a source link.</p></div><div class="layout">${filterPanel()}<section>${searchForm()}<div class="section-head" style="margin-top:28px"><div><h2>${rows.length} matching ${rows.length===1?'reference':'references'}</h2><p>Search: <b>${escapeHTML(state.query||'all topics')}</b> · ${escapeHTML(state.jurisdiction)}</p></div><span class="stat">Example catalog</span></div><div class="results">${rows.length?rows.map(r=>`<article class="panel result-card"><div class="badge-row">${badge(r.edition+' '+r.code)}${badge(r.publisher,'source')}${badge('Verify adoption')}</div><h3>${escapeHTML(r.section)} &nbsp; | &nbsp; ${escapeHTML(r.title)}</h3><p>${escapeHTML(r.about)}</p><div class="meta"><small>${escapeHTML(r.scope)} · Official publication linked in details</small><button class="link-button" data-open="${r.id}">View reference and source →</button></div></article>`).join(''):`<div class="panel empty"><h3>No examples match those filters</h3><p>Try selecting All publications or searching deck guard, handrail, water supply, or ventilation.</p><button class="btn secondary" data-go="home">Start over</button></div>`}</div></section></div>`;}
function detail(){const r=REFS.find(x=>x.id===state.id)||REFS[0];let s=saved.find(x=>x.id===r.id);return `<div class="breadcrumbs"><button data-go="home">Find references</button> &nbsp;/&nbsp; <button data-go="results">Results</button> &nbsp;/&nbsp; ${escapeHTML(r.section)}</div><div class="eyebrow">Step 03 / Verify and save</div><div class="page-head"><h1>Reference details</h1><p>Review the reference metadata and open the publisher’s library to confirm the authoritative language.</p></div><div class="detail-layout"><section class="panel detail-main"><div class="badge-row">${badge(r.edition+' '+r.code)}${badge('Official publisher: '+r.publisher,'source')}</div><h2>${escapeHTML(r.section)} &nbsp; | &nbsp; ${escapeHTML(r.title)}</h2><h3>Why this reference may help</h3><p>${escapeHTML(r.about)}</p><div class="fact-list"><strong>Publication</strong><span>${escapeHTML(r.edition+' '+r.code)}</span><strong>Section / chapter</strong><span>${escapeHTML(r.section)}</span><strong>Publisher</strong><span>${escapeHTML(r.publisher)}</span><strong>Jurisdiction context</strong><span>${escapeHTML(state.jurisdiction)}</span><strong>Authority status</strong><span>Publisher link available; adopted edition and amendments not verified</span></div><div class="subheading">Official source</div><p>This is a link to the publisher's online code library, not a verified direct link to the exact section. Use the section identifier above to find and verify the actual text.</p><a href="${escapeHTML(r.url)}" target="_blank" rel="noopener noreferrer" class="btn" style="display:inline-flex;align-items:center;text-decoration:none">Open publisher library ↗</a><div class="info-band"><div class="small-icon">i</div><div>CodeAssist does not reproduce the protected code text or decide whether a project complies. The user remains responsible for confirming the applicable requirements.</div></div></section><aside class="panel detail-side"><h3>Save this reference</h3><p>Add a note so you remember why the section matters during another plan review or field question.</p><div class="status"><b>Local requirements not verified</b><br>Check adoption, state rules, and applicable local amendments with the authority having jurisdiction.</div><div class="field"><label for="note">Personal note</label><textarea id="note" placeholder="Example: Confirm applicable guard section and local requirements before writing correction comment.">${escapeHTML(s?.note||'')}</textarea></div><div class="actions"><button class="btn" id="save">${s?'Update saved note':'Save reference'} →</button><button class="btn secondary" data-go="saved">View saved</button></div><p style="font-size:11px;margin-top:20px">Notes are stored only in this browser for this course prototype.</p></aside></div>`;}
function savedScreen(){return `<div class="eyebrow">Step 04 / Return to your research</div><div class="page-head"><h1>Saved references</h1><p>A small personal reference list that keeps the code edition, section, and notes together, even when the sources come from different publishers.</p></div><div class="section-head" style="margin-top:32px"><div><h2>My reference list</h2><p>${saved.length} ${saved.length===1?'reference':'references'} available in this browser.</p></div><button class="btn secondary" data-go="home">Find another reference</button></div><div>${saved.length?saved.map(s=>{const r=REFS.find(x=>x.id===s.id);return r?`<article class="panel saved-card"><div><div class="saved-meta">${escapeHTML(label(r))} &nbsp; · &nbsp; ${escapeHTML(r.publisher)} ${s.demo?'<span class="demo-flag">· SAMPLE NOTE</span>':''}</div><h3>${escapeHTML(r.title)}</h3><p>Jurisdiction context: New Mexico · Adoption and local amendments require independent verification.</p><div class="note"><b>My note</b><br>${escapeHTML(s.note||'No note entered yet.')}</div></div><div><button class="btn secondary" data-open="${r.id}">Open reference →</button><br><button class="link-button" data-delete="${r.id}">Remove from list</button></div></article>`:''}).join(''):`<div class="panel empty"><h3>No saved references yet</h3><p>Search for a topic, open a reference, and save it with a personal note.</p><button class="btn" data-go="home">Start searching</button></div>`}</div><div class="info-band" style="max-width:900px"><div class="small-icon">i</div><div><b>Saved is not verified.</b> Bookmarks help locate your research; verify governing requirements and the original publisher each time you rely on them.</div></div>`;}
function render(){const app=document.getElementById('app');app.innerHTML=state.screen==='results'?results():state.screen==='detail'?detail():state.screen==='saved'?savedScreen():home();document.querySelectorAll('[data-go]').forEach(el=>{el.addEventListener('click',()=>navigate(el.dataset.go));if(el.classList.contains('logo'))el.addEventListener('keydown',e=>{if(e.key==='Enter')navigate('home')})});document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>navigate('detail',el.dataset.open)));document.querySelectorAll('[data-delete]').forEach(el=>el.addEventListener('click',()=>{saved=saved.filter(s=>s.id!==el.dataset.delete);saveState();render()}));let f=document.getElementById('searchform');if(f)f.addEventListener('submit',e=>{e.preventDefault();state.query=document.getElementById('search').value.trim();state.code=document.getElementById('code').value;state.edition=document.getElementById('edition').value;state.jurisdiction=document.getElementById('jurisdiction').value;navigate('results')});let apply=document.getElementById('apply');if(apply)apply.addEventListener('click',()=>{state.code=document.getElementById('code').value;state.edition=document.getElementById('edition').value;state.jurisdiction=document.getElementById('jurisdiction').value;state.query=document.getElementById('search')?.value??state.query;navigate('results')});let button=document.getElementById('save');if(button)button.addEventListener('click',()=>{let note=document.getElementById('note').value.trim();saved=saved.filter(x=>x.id!==state.id);saved.unshift({id:state.id,note,demo:false});saveState();navigate('saved')});document.querySelectorAll('.nav button').forEach(x=>x.setAttribute('aria-current',x.dataset.go===state.screen||x.dataset.go==='home'&&['results','detail'].includes(state.screen)?'page':'false'));document.getElementById('save-count').textContent=saved.length?`(${saved.length})`:'';}
window.addEventListener('popstate',()=>{state.screen=new URLSearchParams(location.search).get('screen')||'home';render()});render();
</script>
</body></html>
